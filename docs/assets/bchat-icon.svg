<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024" role="img" aria-label="bChat">
  <title>bChat</title>
  <!-- bChat app tile: the bMovies geometric "b" (b-arc.svg, 45° sharp flag top,
       stem at native x 27–45 = "nudge 0"). Keeps the current tile's glossy light &
       shade: sheen-from-top tile + silver-gradient b with a soft top highlight.
       Bowl hole cut with a mask. Vector — crisp at any size.

       ⚠ THE b GRADIENTS ARE IN USER SPACE, NOT OBJECT-BOUNDING-BOX. The stem and the bowl
       are two shapes making ONE letter. With the SVG default each shape gets its own copy
       of the ramp scaled to its own box — the stem spans y 12-76, the bowl y 39-105 — so at
       the join they sit at different points in the gradient and shade differently. The b
       then reads as a rectangle stuck onto a circle, which is the one thing it must not
       look like. Pinning y1/y2 to the letterform's full extent (12 -> 105) gives one
       continuous ramp across both shapes. Anything added to the b must stay inside that
       range or the seam comes back. -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="26%" r="85%">
      <stop offset="0" stop-color="#313134"/>
      <stop offset="52%" stop-color="#101012"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="bgloss" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="105">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#f2f2f5"/>
      <stop offset="1" stop-color="#c4c4cd"/>
    </linearGradient>
    <linearGradient id="bsheen" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="105">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="bhole">
      <rect x="-10" y="-10" width="140" height="140" fill="#fff"/>
      <circle cx="60" cy="72" r="15" fill="#000"/>
    </mask>
  </defs>
  <rect width="120" height="120" rx="27" ry="27" fill="url(#tile)"/>
  <!-- subtle inner top edge light, matching the current tile bevel -->
  <rect x="1.5" y="1.5" width="117" height="117" rx="25.5" ry="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <g mask="url(#bhole)">
    <g fill="url(#bgloss)">
      <polygon points="45,12 45,76 27,76 27,30"/>
      <circle cx="60" cy="72" r="33"/>
    </g>
    <!-- glossy top highlight on the b, fading down -->
    <g fill="url(#bsheen)">
      <polygon points="45,12 45,76 27,76 27,30"/>
      <circle cx="60" cy="72" r="33"/>
    </g>
  </g>
</svg>
